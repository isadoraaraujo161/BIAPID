    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BIPAID - Nova Meta</title>

    <link rel="stylesheet" href="novameta.css">
</head>

<body>

    <div class="aplicativo">

        <!-- BARRA LATERAL -->

        <aside class="barra-lateral">

            <div class="area-logo">

                <div class="simbolo-logo">B</div>

                <div class="texto-logo">
                    <span>BIPAID</span>
                    <small>
                        VOCÊ FALA.<br>
                        A BIPAID ORGANIZA.
                    </small>
                </div>

            </div>


            <nav class="menu-lateral">

                <a href="paginainicial.html" class="link-menu">
                    <span class="icone-menu">⌂</span>
                    <span class="texto-menu">Início</span>
                </a>

                <a href="agenda.html" class="link-menu">
                    <span class="icone-menu">▦</span>
                    <span class="texto-menu">Agenda</span>
                </a>

                <a href="nota.html" class="link-menu">
                    <span class="icone-menu">☷</span>
                    <span class="texto-menu">Notas</span>
                </a>

                <a href="meudinheiro.html" class="link-menu">
                    <span class="icone-menu">▱</span>
                    <span class="texto-menu">Meu Dinheiro</span>
                </a>

                <a href="metas.html" class="link-menu ativo">
                    <span class="icone-menu">◎</span>
                    <span class="texto-menu">Minhas Metas</span>
                </a>

                <a href="eventos.html" class="link-menu">
                    <span class="icone-menu">♧</span>
                    <span class="texto-menu">Eventos EPT</span>
                </a>

                <a href="semana.html" class="link-menu">
                    <span class="icone-menu">▥</span>
                    <span class="texto-menu">Minha Semana</span>
                </a>
                
                <a href="enem.html" class="link-menu ativo">
                    <span class="icone-menu">✦</span>
                    <span class="texto-menu">ENEM</span>
                </a>

            </nav>


            <div class="parte-inferior">

                <a href="#" class="link-menu link-configuracoes">
                    <span class="icone-menu">⚙</span>
                    <span class="texto-menu">Ajustes</span>
                </a>


                <div class="perfil-usuario">

                    <div class="avatar-usuario">
                        IS
                    </div>

                    <div class="informacoes-usuario">

                      <strong class="nome-usuario">
                       Isabella Guedes
                        </strong>

                        <span>
                         Conta conectada
                        </span>

                        </div>

                </div>

            </div>

        </aside>


        <!-- CONTEÚDO PRINCIPAL -->

        <main class="conteudo-principal">

            <header class="barra-superior">

                <div class="caminho-pagina">

                    <strong>BIPAID</strong>

                    <span>Nova meta</span>

                </div>


                <div class="acoes-superiores">

                    <button class="botao-perfil">
                     <span class="nome-usuario">Isabella Guedes</span>
                     <span>♙</span>
                     </button>

                </div>

            </header>


            <!-- NOVA META -->

            <section class="conteudo-nova-meta">

                <div class="cabecalho-nova-meta">

                    <div>

                        <span class="etiqueta-meta">
                            MINHAS METAS
                        </span>

                        <h1>
                            Criar nova meta
                        </h1>

                        <p>
                            Defina um objetivo e acompanhe seu progresso.
                        </p>

                    </div>

                </div>


                <form id="formulario-meta" class="formulario-meta">


                    <!-- NOME -->

                    <div class="grupo-formulario">

                        <label for="nomeMeta">
                            Nome da meta
                        </label>

                        <input
                            type="text"
                            id="nomeMeta"
                            name="nomeMeta"
                            placeholder="Ex.: Comprar um notebook"
                            required
                        >

                    </div>


                    <!-- CATEGORIA -->

                    <div class="grupo-formulario">

                        <label for="categoriaMeta">
                            Categoria
                        </label>

                        <select
                            id="categoriaMeta"
                            name="categoriaMeta"
                            required
                        >

                            <option value="">
                                Selecione uma categoria
                            </option>

                            <option value="financeira">
                                Financeira
                            </option>

                            <option value="academica">
                                Acadêmica
                            </option>

                            <option value="pessoal">
                                Pessoal
                            </option>

                            <option value="profissional">
                                Profissional
                            </option>

                        </select>

                    </div>


                    <!-- VALORES -->

                    <div class="linha-formulario">

                        <div class="grupo-formulario">

                            <label for="valorObjetivo">
                                Valor objetivo
                            </label>

                            <input
                                type="number"
                                id="valorObjetivo"
                                name="valorObjetivo"
                                placeholder="0,00"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>


                        <div class="grupo-formulario">

                            <label for="valorAtual">
                                Valor já alcançado
                            </label>

                            <input
                                type="number"
                                id="valorAtual"
                                name="valorAtual"
                                placeholder="0,00"
                                min="0"
                                step="0.01"
                                value="0"
                            >

                        </div>

                    </div>


                    <!-- DATA -->

                    <div class="grupo-formulario">

                        <label for="dataLimite">
                            Data limite
                        </label>

                        <input
                            type="date"
                            id="dataLimite"
                            name="dataLimite"
                            required
                        >

                    </div>


                    <!-- DESCRIÇÃO -->

                    <div class="grupo-formulario">

                        <label for="descricaoMeta">
                            Descrição
                        </label>

                        <textarea
                            id="descricaoMeta"
                            name="descricaoMeta"
                            placeholder="Escreva uma descrição para sua meta..."
                            rows="5"
                        ></textarea>

                    </div>


                    <!-- BOTÕES -->

                    <div class="acoes-formulario">

                        <a
                            href="metas.html"
                            class="botao-cancelar"
                        >
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="botao-criar-meta"
                        >
                            Criar meta
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

    <script src="usuario.js"></script>
    <script src="novameta.js"></script>
    

</body>

</html>
